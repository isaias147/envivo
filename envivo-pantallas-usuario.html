<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>EnVivo · Pantallas del usuario</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;700;800&family=Instrument+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --noche:#161A3D;
  --noche-2:#1F2453;
  --noche-3:#2A3068;
  --laton:#FFB627;
  --coral:#FF5E5B;
  --caña:#5FD6A0;
  --hueso:#F4F1E8;
  --hueso-tenue:#A7A9C4;
  --linea:rgba(244,241,232,.14);
}
*{box-sizing:border-box;margin:0;padding:0}
body{
  background:#0D0F26;
  font-family:'Instrument Sans',system-ui,sans-serif;
  color:var(--hueso);
  padding:40px 20px 80px;
  -webkit-font-smoothing:antialiased;
}
.taller{max-width:1240px;margin:0 auto}
.taller-cab{margin-bottom:36px;max-width:60ch}
.taller-cab h1{font-family:Archivo,sans-serif;font-weight:800;font-size:26px;letter-spacing:-.02em}
.taller-cab p{color:var(--hueso-tenue);font-size:14px;line-height:1.7;margin-top:8px}
.fila{display:flex;gap:34px;flex-wrap:wrap;align-items:flex-start}
.slot{width:340px}
.slot-nom{font-size:12px;color:var(--hueso-tenue);margin-bottom:10px;letter-spacing:.01em}
.tel{
  width:340px;height:700px;background:var(--noche);border-radius:34px;
  border:1px solid var(--linea);overflow:hidden;position:relative;display:flex;flex-direction:column;
}

/* ---------- barra superior ---------- */
.top{padding:18px 18px 0;flex-shrink:0}
.marca{display:flex;align-items:baseline;justify-content:space-between;margin-bottom:16px}
.marca b{font-family:Archivo,sans-serif;font-weight:800;font-size:19px;letter-spacing:-.03em}
.marca b i{color:var(--laton);font-style:normal}
.cambio{
  font-size:12px;color:var(--hueso-tenue);background:none;border:0;cursor:pointer;
  font-family:inherit;display:flex;align-items:center;gap:5px;padding:6px 0;
}
.cambio:hover{color:var(--hueso)}
.reel{display:flex;gap:7px;overflow-x:auto;padding-bottom:14px;scrollbar-width:none}
.reel::-webkit-scrollbar{display:none}
.f{
  border:1px solid var(--linea);background:transparent;color:var(--hueso-tenue);
  font-family:inherit;font-size:13px;padding:7px 14px;border-radius:100px;cursor:pointer;white-space:nowrap;
}
.f[aria-pressed="true"]{background:var(--hueso);color:var(--noche);border-color:var(--hueso);font-weight:600}

/* ---------- mapa ---------- */
.lienzo{flex:1;position:relative;overflow:hidden}
.mapa{position:absolute;inset:0}
.radio-cinta{
  position:absolute;left:0;right:0;bottom:0;padding:14px 18px 16px;
  background:linear-gradient(to top,var(--noche) 62%,transparent);
  display:flex;align-items:center;gap:8px;z-index:4;
}
.radio-cinta span{font-size:12px;color:var(--hueso-tenue);margin-right:2px}
.km{
  border:1px solid var(--linea);background:transparent;color:var(--hueso-tenue);
  font-family:inherit;font-size:12px;width:44px;padding:6px 0;border-radius:6px;cursor:pointer;
}
.km[aria-pressed="true"]{border-color:var(--laton);color:var(--laton)}
.chinche{position:absolute;transform:translate(-50%,-100%);cursor:pointer;z-index:3;background:none;border:0;padding:0}
.chinche .hora{
  font-family:Archivo,sans-serif;font-weight:700;font-size:11.5px;letter-spacing:-.01em;
  background:var(--hueso);color:var(--noche);padding:4px 8px;border-radius:5px;display:flex;
  align-items:baseline;gap:6px;max-width:132px;
}
.chinche .hora em{font-style:normal;font-weight:500;font-family:'Instrument Sans',sans-serif;font-size:11px;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;opacity:.78}
.chinche .pie{width:1px;height:11px;background:var(--hueso);margin:0 auto}
.chinche.gratis .hora{background:var(--caña)}
.chinche.gratis .pie{background:var(--caña)}
.chinche[data-on="1"] .hora{background:var(--laton);color:var(--noche);font-size:13px;padding:5px 10px;max-width:168px}
.chinche[data-on="1"] .hora em{opacity:1;font-weight:600;font-size:12px}
.chinche[data-on="1"] .pie{background:var(--laton);height:15px}

/* ---------- ficha inferior ---------- */
.ficha{
  flex-shrink:0;border-top:1px solid var(--linea);padding:16px 18px 20px;
  background:var(--noche);cursor:pointer;min-height:132px;
}
.ficha-vacia{color:var(--hueso-tenue);font-size:13px;line-height:1.6;padding-top:8px}
.ficha-cab{display:flex;gap:14px;align-items:flex-start}
.hora-grande{
  font-family:Archivo,sans-serif;font-weight:800;font-size:27px;line-height:.92;
  color:var(--laton);letter-spacing:-.035em;flex-shrink:0;padding-top:2px;
}
.hora-grande small{display:block;font-size:11px;font-weight:500;letter-spacing:.06em;color:var(--hueso-tenue);margin-top:5px}
.ficha h3{font-family:Archivo,sans-serif;font-weight:700;font-size:17px;line-height:1.22;letter-spacing:-.02em}
.sede{font-size:13px;color:var(--hueso-tenue);margin-top:5px;line-height:1.45}
.tiras{display:flex;gap:7px;margin-top:11px;flex-wrap:wrap}
.tira{font-size:11.5px;padding:3px 9px;border-radius:4px;background:var(--noche-3);color:var(--hueso)}
.tira.libre{background:rgba(95,214,160,.15);color:var(--caña)}
.tira.serie{background:rgba(255,182,39,.14);color:var(--laton)}

/* ---------- lista ---------- */
.lista{flex:1;overflow-y:auto;padding:2px 18px 20px}
.dia{
  font-family:Archivo,sans-serif;font-weight:700;font-size:12px;color:var(--hueso-tenue);
  padding:16px 0 9px;border-bottom:1px solid var(--linea);margin-bottom:4px;letter-spacing:.02em;
}
.reng{display:flex;gap:14px;padding:15px 0;border-bottom:1px solid var(--linea);cursor:pointer;align-items:flex-start}
.reng:last-child{border-bottom:0}
.reng-h{font-family:Archivo,sans-serif;font-weight:700;font-size:15px;color:var(--laton);width:62px;flex-shrink:0;padding-top:1px;letter-spacing:-.02em}
.reng-h.libre{color:var(--caña)}
.reng h4{font-family:Archivo,sans-serif;font-weight:700;font-size:15px;line-height:1.25;letter-spacing:-.015em}
.reng p{font-size:12.5px;color:var(--hueso-tenue);margin-top:4px}

/* ---------- detalle ---------- */
.det{flex:1;overflow-y:auto}
.volver{
  position:absolute;top:16px;left:16px;z-index:5;background:rgba(22,26,61,.82);
  border:1px solid var(--linea);color:var(--hueso);font-family:inherit;font-size:13px;
  padding:8px 14px;border-radius:100px;cursor:pointer;backdrop-filter:blur(6px);
}
.cartel{height:250px;position:relative;overflow:hidden}
.cartel-fondo{position:absolute;inset:0;background:var(--noche-2)}
.cartel-vel{position:absolute;inset:0;background:linear-gradient(to top,var(--noche) 4%,rgba(22,26,61,.1) 55%)}
.det-cuerpo{padding:0 20px 26px;margin-top:-46px;position:relative;z-index:2}
.det-hora{font-family:Archivo,sans-serif;font-weight:800;font-size:38px;color:var(--laton);letter-spacing:-.04em;line-height:1}
.det-fecha{font-size:13px;color:var(--hueso-tenue);margin-top:7px}
.det h2{font-family:Archivo,sans-serif;font-weight:800;font-size:25px;line-height:1.13;margin-top:16px;letter-spacing:-.03em}
.det-desc{font-size:14px;line-height:1.65;color:#DCD9CE;margin-top:13px}
.dato{display:flex;gap:12px;padding:14px 0;border-bottom:1px solid var(--linea);font-size:13.5px;align-items:flex-start}
.dato:first-of-type{border-top:1px solid var(--linea)}
.dato b{color:var(--hueso-tenue);font-weight:400;width:76px;flex-shrink:0}
.acciones{margin-top:22px;display:flex;flex-direction:column;gap:9px}
.wa{
  background:var(--laton);color:#231A00;border:0;font-family:Archivo,sans-serif;font-weight:700;
  font-size:15px;padding:15px;border-radius:9px;cursor:pointer;letter-spacing:-.01em;
}
.par{display:flex;gap:9px}
.sec{
  flex:1;background:transparent;border:1px solid var(--linea);color:var(--hueso);
  font-family:inherit;font-size:13.5px;padding:13px;border-radius:9px;cursor:pointer;
}
.sec:hover{border-color:var(--hueso-tenue)}
.cartel svg{position:absolute;inset:0;width:100%;height:100%}
.mini{width:64px;height:80px;border-radius:6px;overflow:hidden;flex-shrink:0;background:var(--noche-3)}
.mini svg{width:100%;height:100%;display:block}
.reng .mini{width:46px;height:58px;border-radius:5px}
.pub{
  background:transparent;border:1px solid var(--hueso-tenue);color:var(--hueso);
  font-family:'Archivo',sans-serif;font-weight:700;font-size:14px;padding:14px;border-radius:9px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;gap:9px;letter-spacing:-.01em;
}
.pub:hover{border-color:var(--hueso)}
.pub svg{width:17px;height:17px;flex-shrink:0}
.autor{margin-top:22px;padding-top:16px;border-top:1px solid var(--linea)}
.autor small{display:block;font-size:12px;color:var(--hueso-tenue);margin-bottom:8px}
.autor b{font-family:Archivo,sans-serif;font-weight:700;font-size:15px;display:block;margin-bottom:9px;letter-spacing:-.015em}
.redes{display:flex;gap:7px;flex-wrap:wrap}
.red{
  background:var(--noche-3);color:var(--hueso);border:0;font-family:inherit;font-size:12.5px;
  padding:7px 11px;border-radius:6px;cursor:pointer;display:flex;align-items:center;gap:6px;
}
.red:hover{background:#343B7C}
.red svg{width:13px;height:13px}
@media(max-width:760px){body{padding:24px 14px 60px}.slot,.tel{width:100%;max-width:360px}}
</style>
</head>
<body>
<div class="taller">
  <div class="taller-cab">
    <h1>EnVivo · las tres pantallas del usuario</h1>
    <p>Toca los pines del mapa, cambia los filtros y entra al detalle. Las tres pantallas están vivas.</p>
  </div>

  <div class="fila">
    <div class="slot">
      <div class="slot-nom">1 · Mapa</div>
      <div class="tel">
        <div class="top">
          <div class="marca">
            <b>En<i>Vivo</i></b>
            <button class="cambio" id="aLista">Ver lista</button>
          </div>
          <div class="reel">
            <button class="f" data-f="hoy" aria-pressed="true">Esta noche</button>
            <button class="f" data-f="finde" aria-pressed="false">Este finde</button>
            <button class="f" data-f="todo" aria-pressed="false">Próximos</button>
          </div>
        </div>
        <div class="lienzo">
          <svg class="mapa" viewBox="0 0 340 400" preserveAspectRatio="xMidYMid slice">
            <rect width="340" height="400" fill="#1A1F47"/>
            <g stroke="#242A5C" stroke-width="9" stroke-linecap="square">
              <path d="M-10 118 H350 M-10 262 H350 M96 -10 V410 M232 -10 V410"/>
            </g>
            <g stroke="#212752" stroke-width="4">
              <path d="M-10 62 H350 M-10 190 H350 M-10 330 H350 M42 -10 V410 M164 -10 V410 M296 -10 V410"/>
            </g>
            <path d="M-10 150 Q80 140 168 176 T350 158" stroke="#20305E" stroke-width="11" fill="none"/>
            <rect x="238" y="272" width="86" height="82" rx="3" fill="#1E2A4E"/>
            <text x="281" y="318" font-size="10" fill="#5C6493" text-anchor="middle" font-family="Instrument Sans">Parque</text>
            <circle cx="170" cy="205" r="104" fill="#FFB627" opacity=".05"/>
            <circle cx="170" cy="205" r="104" fill="none" stroke="#FFB627" stroke-width="1" stroke-dasharray="3 6" opacity=".45"/>
            <circle cx="170" cy="205" r="17" fill="#FFB627" opacity=".16"/>
            <circle cx="170" cy="205" r="5.5" fill="#FFB627"/>
          </svg>
          <div id="chinches"></div>
          <div class="radio-cinta">
            <span>Radio</span>
            <button class="km" data-km="1" aria-pressed="false">1 km</button>
            <button class="km" data-km="3" aria-pressed="true">3 km</button>
            <button class="km" data-km="5" aria-pressed="false">5 km</button>
          </div>
        </div>
        <div class="ficha" id="ficha"></div>
      </div>
    </div>

    <div class="slot">
      <div class="slot-nom">2 · Lista</div>
      <div class="tel">
        <div class="top">
          <div class="marca">
            <b>En<i>Vivo</i></b>
            <button class="cambio" id="aMapa">Ver mapa</button>
          </div>
          <div class="reel">
            <button class="f2" data-f="hoy" aria-pressed="true">Esta noche</button>
            <button class="f2" data-f="finde" aria-pressed="false">Este finde</button>
            <button class="f2" data-f="todo" aria-pressed="false">Próximos</button>
          </div>
        </div>
        <div class="lista" id="lista"></div>
      </div>
    </div>

    <div class="slot">
      <div class="slot-nom">3 · Detalle</div>
      <div class="tel" style="position:relative">
        <button class="volver">Volver</button>
        <div class="det" id="det"></div>
      </div>
    </div>
  </div>
</div>

<script>
const ev=[
 {id:1,x:33,y:38,n:"Noche de salsa con La Clave",sede:"Bar La Topa Tolondra",dir:"Calle 5 con carrera 39, Granada",h:"9:00",m:"pm",p:"Cover $20.000",libre:0,t:"Música en vivo",serie:"",d:"hoy",fecha:"Sábado 5 de septiembre",ig:"latopatolondra",
  desc:"Orquesta completa en tarima y pista abierta toda la noche. Llega antes de las 10 si quieres mesa."},
 {id:2,x:63,y:26,n:"Clase de salsa para principiantes",sede:"Escuela Swing Latino",dir:"Carrera 38 #4-21, San Fernando",h:"8:00",m:"pm",p:"Gratis",libre:1,t:"Clase o taller",serie:"Todos los jueves",d:"hoy",fecha:"Sábado 5 de septiembre",ig:"swinglatino",
  desc:"Una hora de pasos básicos. No necesitas pareja ni experiencia previa, solo zapatos cómodos."},
 {id:3,x:76,y:74,n:"Cine al aire libre: Cinema Paradiso",sede:"Parque del Perro, tarima norte",dir:"Parque del Perro, San Fernando",h:"7:30",m:"pm",p:"Gratis",libre:1,t:"Cultural",serie:"",d:"hoy",fecha:"Sábado 5 de septiembre",ig:"culturacali",
  desc:"Proyección al aire libre sobre el césped. Trae cobija o silla; hay venta de comida alrededor."},
 {id:4,x:20,y:63,n:"Jam de música caleña",sede:"Zaperoco Bar",dir:"Avenida 5 Norte #16-46",h:"10:00",m:"pm",p:"Cover $15.000",libre:0,t:"Música en vivo",serie:"Todos los viernes",d:"finde",fecha:"Viernes 11 de septiembre",ig:"zaperocobar",
  desc:"Músicos de la ciudad se turnan la tarima. Si tocas, puedes anotarte en la lista al llegar."},
 {id:5,x:50,y:56,n:"Yoga al amanecer",sede:"Parque del Perro",dir:"Parque del Perro, zona central",h:"6:30",m:"am",p:"Gratis",libre:1,t:"Recreativo",serie:"Todos los sábados",d:"finde",fecha:"Sábado 12 de septiembre",ig:"yogacali",
  desc:"Sesión suave de una hora en el césped. Lleva tu mat o una toalla grande."}
];
const extra={
 1:{pub:{tipo:"reel",url:"https://instagram.com/reel/x"},redes:{instagram:"latopatolondra",tiktok:"latopatolondra"}},
 2:{pub:{tipo:"tiktok",url:"https://tiktok.com/@swinglatino/video/x"},redes:{instagram:"swinglatino",tiktok:"swinglatino"}},
 3:{pub:{tipo:"post",url:"https://instagram.com/p/x"},redes:{instagram:"culturacali"}},
 4:{pub:{tipo:"reel",url:"https://instagram.com/reel/y"},redes:{instagram:"zaperocobar"}},
 5:{pub:null,redes:{instagram:"yogacali",tiktok:"yogacali"}}
};
const icoIg='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="2" y="2" width="20" height="20" rx="5"/><circle cx="12" cy="12" r="4"/><circle cx="17.5" cy="6.5" r="1" fill="currentColor" stroke="none"/></svg>';
const icoTk='<svg viewBox="0 0 24 24" fill="currentColor"><path d="M16.5 3c.3 2.4 1.7 4 4 4.3v3.1c-1.5 0-2.9-.5-4-1.3v6.4a5.9 5.9 0 1 1-5.9-5.9c.3 0 .6 0 .9.1v3.2a2.8 2.8 0 1 0 1.9 2.6V3h3.1z"/></svg>';
const icoPlay='<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="4" width="18" height="16" rx="3"/><path d="M10 9l5 3-5 3z" fill="currentColor" stroke="none"/></svg>';
const paletas={
 1:{f:"#B8232F",t:"#FFE7C2",a:"#FFB627"},
 2:{f:"#1F6F8B",t:"#EAF7FF",a:"#FFD166"},
 3:{f:"#2C2A4A",t:"#F4F1E8",a:"#F4A259"},
 4:{f:"#4A1942",t:"#FFE1F1",a:"#FF7B9C"},
 5:{f:"#2F6B3A",t:"#EAFBE7",a:"#FFE066"}
};
function flyer(e,grande){
  const p=paletas[e.id];
  const palabras=e.n.split(' ');
  const lineas=[];let l='';
  palabras.forEach(w=>{if((l+' '+w).trim().length>12){lineas.push(l.trim());l=w;}else l+=' '+w;});
  if(l.trim())lineas.push(l.trim());
  const txt=lineas.slice(0,4).map((s,i)=>`<text x="30" y="${190+i*54}" font-size="46" font-weight="800" fill="${p.t}" font-family="Archivo,sans-serif" letter-spacing="-1.5">${s.toUpperCase()}</text>`).join('');
  return `<svg viewBox="0 0 320 400" preserveAspectRatio="${grande?'xMidYMid slice':'xMidYMid slice'}">
    <rect width="320" height="400" fill="${p.f}"/>
    <circle cx="262" cy="86" r="62" fill="${p.a}" opacity=".9"/>
    <rect x="0" y="330" width="320" height="70" fill="${p.a}" opacity=".16"/>
    <text x="30" y="70" font-size="18" font-weight="600" fill="${p.t}" font-family="Instrument Sans,sans-serif" opacity=".85">${e.sede.split(',')[0]}</text>
    ${txt}
    <text x="30" y="372" font-size="26" font-weight="800" fill="${p.a}" font-family="Archivo,sans-serif" letter-spacing="-1">${e.h} ${e.m.toUpperCase()}</text>
    <text x="290" y="372" font-size="14" font-weight="600" fill="${p.t}" text-anchor="end" font-family="Instrument Sans,sans-serif" opacity=".8">${e.p}</text>
  </svg>`;
}
const etiquetaPub=p=>p.tipo==="reel"?"Ver el reel":p.tipo==="tiktok"?"Ver en TikTok":"Ver publicación";
let filtro="hoy", sel=null;
const $=id=>document.getElementById(id);
const visibles=()=>ev.filter(e=>filtro==="todo"?true:filtro==="hoy"?e.d==="hoy":e.d!=="hoy"||e.d==="hoy");
const tiras=e=>`<div class="tiras"><span class="tira${e.libre?' libre':''}">${e.p}</span>${e.serie?`<span class="tira serie">${e.serie}</span>`:''}<span class="tira">${e.t}</span></div>`;

function pintaChinches(){
  $('chinches').innerHTML=visibles().map(e=>
    `<button class="chinche${e.libre?' gratis':''}" data-id="${e.id}" data-on="${sel===e.id?1:0}" style="left:${e.x}%;top:${e.y}%">
       <span class="hora">${e.h}<em>${e.n.length>20?e.n.slice(0,20).trim()+"…":e.n}</em></span><span class="pie"></span></button>`).join('');
  $('chinches').querySelectorAll('.chinche').forEach(b=>b.onclick=()=>{sel=+b.dataset.id;pintaChinches();pintaFicha();});
}
function pintaFicha(){
  const e=ev.find(x=>x.id===sel);
  $('ficha').innerHTML=e?
    `<div class="ficha-cab"><div class="mini">${flyer(e)}</div>
     <div><div style="font-family:Archivo,sans-serif;font-weight:800;font-size:22px;color:var(--laton);letter-spacing:-.03em;line-height:1;margin-bottom:6px">${e.h} <span style="font-size:12px;font-weight:500;color:var(--hueso-tenue);letter-spacing:.05em">${e.m.toUpperCase()}</span></div><h3>${e.n}</h3><p class="sede">${e.sede}</p>${tiras(e)}</div></div>`:
    `<p class="ficha-vacia">Toca un pin para ver de qué se trata. Los pines en verde son gratis.</p>`;
  if(e)$('ficha').onclick=()=>pintaDetalle(e.id);
}
function pintaLista(){
  const g=visibles();
  const grupos=[...new Set(g.map(e=>e.fecha))];
  $('lista').innerHTML=grupos.map(f=>
    `<div class="dia">${f}</div>`+g.filter(e=>e.fecha===f).map(e=>
      `<div class="reng" data-id="${e.id}"><div class="mini">${flyer(e)}</div>
       <div><div class="reng-h${e.libre?' libre':''}" style="width:auto;margin-bottom:4px">${e.h} ${e.m}</div><h4>${e.n}</h4><p>${e.sede} · ${e.p}</p></div></div>`).join('')).join('')
    ||`<p class="ficha-vacia" style="padding-top:26px">Nada por aquí todavía en este filtro.</p>`;
  $('lista').querySelectorAll('.reng').forEach(r=>r.onclick=()=>pintaDetalle(+r.dataset.id));
}
function pintaDetalle(id){
